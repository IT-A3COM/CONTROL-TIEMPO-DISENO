<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:13px;background:#f0f2f5;padding:12px}
h1{font-size:15px;font-weight:700;text-align:center;margin-bottom:2px;color:#1a1a2e;letter-spacing:1px;text-transform:uppercase}
.subtitle{text-align:center;font-size:11px;color:#666;margin-bottom:8px}

.top-btns{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}

.ot-tab{padding:6px 14px;border:1px solid #bbb;border-bottom:none;border-radius:5px 5px 0 0;cursor:pointer;font-size:12px;font-weight:600;background:#dde0e8;color:#444;display:flex;align-items:center;gap:6px}
.ot-tab.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.ot-tab.estado-verde{background:#27ae60;color:#fff;border-color:#1e8449}
.ot-tab.estado-verde.active{background:#1e8449;border-color:#1e8449}
.ot-tab.estado-naranja{background:#e67e22;color:#fff;border-color:#ca6f1e}
.ot-tab.estado-naranja.active{background:#ca6f1e;border-color:#ca6f1e}

.ot-tab.estado-rojo.active{background:#cb4335;border-color:#cb4335}
.close-ot{font-size:10px;background:rgba(255,255,255,.3);border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;color:#fff;font-weight:900;line-height:18px;text-align:center;padding:0;pointer-events:all;position:relative;z-index:999}
.ot-tab:not([class*="estado-"]) .close-ot{background:rgba(255,0,0,.7);color:#fff}
.btn-new-ot{padding:6px 13px;border:1px dashed #1a1a2e;border-bottom:none;border-radius:5px 5px 0 0;cursor:pointer;font-size:12px;font-weight:700;background:#fff;color:#1a1a2e}
.ot-content{background:#fff;border:1px solid #1a1a2e;border-top:none;border-radius:0 0 8px 8px;padding:12px;margin-bottom:14px}
.ot-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ot-meta label{font-weight:700;font-size:12px;white-space:nowrap}

.badge-abierta{background:#2980b9;color:#fff}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
thead tr{background:#1a1a2e;color:#fff}

.time-display.empty{color:#aaa;font-weight:400;font-size:10px}

.btn-start{background:#27ae60;color:#fff}

.btn-a{padding:6px 14px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
.btn-a:disabled{opacity:.4;cursor:default}
.btn-add-row{background:#444;color:#fff}
.btn-finalizar{background:#e67e22;color:#fff}
.btn-reabrir{background:#2980b9;color:#fff}
.btn-print-ot{background:#7f8c8d;color:#fff}
.btn-excel{background:#1e7145;color:#fff}
.btn-save-now{background:#2980b9;color:#fff}
.btn-danger{background:#c0392b;color:#fff}
.btn-tabs{display:flex;gap:4px;margin-bottom:12px}
.view-tab{padding:6px 16px;border:none;border-radius:5px 5px 0 0;cursor:pointer;font-size:12px;font-weight:700;background:#ccd0d9;color:#444}
.view-tab.active{background:#1a1a2e;color:#fff}
.view-panel{display:none}
.view-panel.active{display:block}
.resumen-section{background:#fff;border:1px solid #ccc;border-radius:8px;padding:14px;margin-bottom:10px}
.grand-total-box{background:#1a1a2e;color:#fff;border-radius:6px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.gt-val{font-size:18px;font-weight:700}
.resumen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.resumen-card{border:1px solid #ccc;border-radius:6px;overflow:hidden}
.rcard-head{color:#fff;font-size:11px;font-weight:700;padding:6px 12px;display:flex;justify-content:space-between;background:#1a1a2e}
.rcard-body{padding:8px 12px}
.rcard-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #f0f0f0}
.rcard-row:last-child{border-bottom:none}
.rcard-label{color:#444;max-width:60%;word-break:break-word}
.rcard-val{font-weight:700;color:#1a1a2e}
.status-badge{border-radius:3px;padding:2px 6px;font-size:10px;font-weight:700}
.status-open{background:#2980b9;color:#fff}
.status-closed{background:#27ae60;color:#fff}
#loading-overlay{position:fixed;inset:0;background:#f0f2f5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px}
#loading-overlay .spin{width:36px;height:36px;border:4px solid #ccc;border-top-color:#1a1a2e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-overlay p{color:#1a1a2e;font-weight:700;font-size:14px}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:none;align-items:center;justify-content:center}
#modal-overlay.visible{display:flex}
#modal-box{background:#fff;border-radius:10px;padding:28px 24px;max-width:340px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.3);text-align:center}
#modal-box h3{font-size:15px;color:#1a1a2e;margin-bottom:10px}
#modal-box p{font-size:13px;color:#555;margin-bottom:20px;line-height:1.5}
#modal-box .modal-btns{display:flex;gap:10px;justify-content:center}
#modal-box .modal-btns button{padding:8px 22px;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
#modal-btn-cancel{background:#ccc;color:#333}
#modal-btn-ok{background:#c0392b;color:#fff}
</style>

<body>

<div id="loading-overlay">
  <div class="spin"></div>
  <p>Cargando tus datos…</p>
</div>

<h1>Control de Tiempos por Orden de Trabajo</h1>
<div class="subtitle">Gestiona múltiples OT simultáneamente · Pausa y reanuda cada línea</div>
<div id="save-status" class="info">Iniciando…</div>

<div class="top-btns">
  <button class="btn-a btn-save-now" onclick="saveNow()">💾 Guardar ahora</button>
  <button class="btn-a btn-excel" onclick="exportResumenExcel()">📥 Exportar todo a Excel</button>
  <button class="btn-a" id="btn-edit-lock" onclick="toggleEditLock()" style="background:#8e44ad;color:#fff">🔒 Edición bloqueada</button>
</div>

<div class="btn-tabs">
  <button class="view-tab active" onclick="showView('registro')">📋 Registro de OT</button>
  <button class="view-tab" onclick="showView('resumen');buildResumen()">📊 Resumen global</button>
</div>

<div class="view-panel active" id="view-registro">
  <div class="btn-tabs" id="operario-tabs" style="margin-bottom:8px;">
  <button class="view-tab active" onclick="setCarpetaOperario('Alberto Vivoras')">👷 Alberto Vivoras</button>
  <button class="view-tab" onclick="setCarpetaOperario('Juanjo Cerdá')">👷 Juanjo Cerdá</button>
  <button class="view-tab" onclick="setCarpetaOperario('Juan Carlos')">👷 Juan Carlos</button>
  <button class="view-tab" onclick="setCarpetaOperario('Juan Ramón')">👷 Juan Ramón</button>
  <button class="view-tab" onclick="setCarpetaOperario('Otro...')">👷 Otro...</button>
</div>
  <!-- Filtro Abiertas / OT finalizadas -->
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
    <strong style="font-size:12px;color:#333">OT:</strong>
    <button class="btn-a" id="btn-ot-abiertas" onclick="setOTFilter('abiertas')" style="background:#1a1a2e;color:#fff">Abiertas</button>
    <button class="btn-a" id="btn-ot-cerradas" onclick="setOTFilter('cerradas')" style="background:#7f8c8d;color:#fff">OT finalizadas</button>
  </div>

  

  <div class="ot-tabs-bar" id="ot-tabs-bar">
    <button class="btn-new-ot" onclick="createOT()">＋ Nueva OT</button>
  </div>
  <div id="ot-panels"></div>
</div>

<div class="view-panel" id="view-resumen">
  <div class="resumen-section">
    <div class="grand-total-box">
      <span style="font-size:13px;font-weight:700">⏱ Tiempo total registrado</span>
      <span class="gt-val" id="gt-val">0h 00min</span>
    </div>
    <div class="resumen-grid" id="resumen-grid"></div>
  </div>
</div>

<iframe id="print-frame" style="display:none"></iframe>

<div id="modal-overlay">
  <div id="modal-box">
    <h3>⚠️ Eliminar OT</h3>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button id="modal-btn-cancel" onclick="modalCancel()">Cancelar</button>
      <button id="modal-btn-ok" onclick="modalOk()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script>
// Constantes
const OPERARIOS = ['Alberto Vivoras','Juanjo Cerdá','Juan Carlos','Juan Ramón','Otro'];
const PROCESOS  = ['Diseño','Maquetación','Retoque','Reunión','Formación','Varios'];

let ots=[], otId=0, rowId=0, activeOT=null;
let saveTimer=null, pendingSave=false, isSaving=false;
let editUnlocked = false;
const EDIT_PASSWORD = 'A3com2026';
let otFilter = 'abiertas'; // 'abiertas' o 'cerradas'
let carpetaOperario = 'Alberto Vivoras';

const pad=n=>String(n).padStart(2,'0');
function fmtTime(ts){if(!ts)return'--:--:--';const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function fmtSec(s){return Math.floor(s/3600)+'h '+pad(Math.floor((s%3600)/60))+'min '+pad(s%60)+'s'}
function fmtSecShort(s){return Math.floor(s/3600)+'h '+pad(Math.floor((s%3600)/60))+'min'}
function today(){return new Date().toLocaleDateString('es-ES')}

function opOptions(sel=''){
  return'<option value="">— Operario —</option>'+OPERARIOS.map(o=>`<option${o===sel?' selected':''}>${o}</option>`).join('');
}
function prOptions(sel=''){
  return'<option value="">— Proceso —</option>'+PROCESOS.map(p=>`<option${p===sel?' selected':''}>${p}</option>`).join('');
}

function setStatus(msg,cls,autoClear=true){
  const el=document.getElementById('save-status');
  el.textContent=msg;el.className=cls;el.style.opacity='1';
  if(autoClear)setTimeout(()=>{el.style.opacity='0';},3000);
}

// Modal
let modalCallback=null;
function showModal(msg,cb){
  document.getElementById('modal-msg').textContent=msg;
  document.getElementById('modal-overlay').classList.add('visible');
  modalCallback=cb;
}
function modalOk(){
  document.getElementById('modal-overlay').classList.remove('visible');
  if(modalCallback)modalCallback();
  modalCallback=null;
}
function modalCancel(){
  document.getElementById('modal-overlay').classList.remove('visible');
  modalCallback=null;
}

// Firestore storage
async function loadFromStorage(){
  try{
    const snap = await FIRESTORE_DOC.get();
    if(snap.exists){
      return snap.data();
    }
  }catch(e){
    console.error('Error leyendo Firestore',e);
    setStatus('⚠️ Error al leer datos compartidos','err');
  }
  return null;
}
async function writeToStorage(data){
  try{
    await FIRESTORE_DOC.set(data);
    return true;
  }catch(e){
    console.error('Error escribiendo Firestore',e);
    return false;
  }
}

function collectState(){
  return{
    ots:ots.map(ot=>({
      id:ot.id,
      num:ot.num,
      desc:ot.desc,
      cliente:ot.cliente||'',
      cerrada:ot.cerrada,
      rows:ot.rows.map(r=>{
        const tr=document.getElementById('row-'+r.id);
        const c=tr?tr.querySelectorAll('.cell'):[];
        return{
          id:r.id,otId:r.otId,
          fecha:c[0]?.value||'',
          operario:c[1]?.value||'',
          proceso:c[2]?.value||'',
          obs:c[3]?.value||'',
          startTs:r.startTs,
          endTs:r.endTs,
          pauses:r.pauses||[],
          pauseStart:r.pauseStart,
          locked:r.locked
        };
      })
    })),
    otId,rowId,activeOT
  };
}

function autosave(){
  pendingSave=true;
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,800);
}
async function flushSave(){
  if(!pendingSave||isSaving)return;
  pendingSave=false;isSaving=true;
  setStatus('💾 Guardando en la nube…','saving',false);
  const ok=await writeToStorage(collectState());
  isSaving=false;
  if(ok)setStatus('✅ Guardado compartido','ok');
  else{
    setStatus('❌ Error al guardar — reintentando…','err',false);
    await new Promise(r=>setTimeout(r,2000));
    const ok2=await writeToStorage(collectState());
    setStatus(ok2?'✅ Guardado (reintento)':'❌ No se pudo guardar','ok');
  }
}
async function saveNow(){if(saveTimer)clearTimeout(saveTimer);pendingSave=true;await flushSave();}

// Color estado OT
function getOTColorState(ot){
  if(ot.cerrada) return 'rojo';
  const rows = ot.rows;
  const hayPausa = rows.some(r => r.startTs && !r.endTs && r.pauseStart);
  if(hayPausa) return 'naranja';
  const hayActiva = rows.some(r => r.startTs && !r.endTs && !r.pauseStart);
  if(hayActiva) return 'verde';
  return '';
}

// Filtro Abiertas / Cerradas
function setOTFilter(tipo){
  otFilter = tipo;
  const btnA = document.getElementById('btn-ot-abiertas');
  const btnC = document.getElementById('btn-ot-cerradas');
  if(tipo === 'abiertas'){
    if(btnA){btnA.style.background='#1a1a2e';btnA.style.color='#fff';}
    if(btnC){btnC.style.background='#7f8c8d';btnC.style.color='#fff';}
  }else{
    if(btnA){btnA.style.background='#7f8c8d';btnA.style.color='#fff';}
    if(btnC){btnC.style.background='#1a1a2e';btnC.style.color='#fff';}
  }
  applyOTFilter();
}

function applyOTFilter(){
  ots.forEach(ot=>{
    const tab = document.getElementById('tab-ot-'+ot.id);
    const panel = document.getElementById('panel-ot-'+ot.id);
    if(!tab || !panel) return;
    const esCerrada = !!ot.cerrada;
    const visible = (otFilter === 'abiertas') ? !esCerrada : esCerrada;
    tab.style.display = visible ? '' : 'none';
    panel.style.display = (visible && ot.id === activeOT) ? 'block' : 'none';
  });

  const actual = ots.find(o=>o.id===activeOT);
  if(actual && ((otFilter==='abiertas'&&actual.cerrada)||(otFilter==='cerradas'&&!actual.cerrada))){
    const candidato = ots.find(o=> (otFilter==='abiertas') ? !o.cerrada : o.cerrada );
    if(candidato) activateOT(candidato.id);
  }
}

// Boot
async function boot(){
  const saved=await loadFromStorage();
  if(saved&&saved.ots&&saved.ots.length){
    otId=saved.otId||0;rowId=saved.rowId||0;
    for(const sot of saved.ots){
      const ot={
        id:sot.id,
        num:sot.num,
        desc:sot.desc||'',
        cliente:sot.cliente||'',
        rows:[],
        cerrada:!!sot.cerrada
      };
      ots.push(ot);
      renderOTTab(ot);
      renderOTPanel(ot);
      const numEl=document.getElementById('otnum-'+ot.id);
      const descEl=document.getElementById('otdesc-'+ot.id);
      const cliEl=document.getElementById('otcli-'+ot.id);
      if(numEl)numEl.value=ot.num;
      if(descEl)descEl.value=ot.desc||'';
      if(cliEl)cliEl.value=ot.cliente||'';
      for(const sr of sot.rows||[]){
        const r={
          id:sr.id,otId:ot.id,
          startTs:sr.startTs,
          endTs:sr.endTs,
          pauses:sr.pauses||[],
          pauseStart:sr.pauseStart,
          locked:sr.locked
        };
        ot.rows.push(r);
        appendRowEl(ot.id,r,sr);
      }
      if(ot.cerrada)restoreCerrada(ot.id);
      refreshRowNums(ot.id);
      updateOTTotal(ot.id);
      updateTabLabel(ot.id);
    }
    const act=saved.activeOT&&ots.find(o=>o.id===saved.activeOT)?saved.activeOT:ots[0]?.id;
    if(act)activateOT(act);
    setStatus('✅ Datos compartidos cargados','ok');
  }else{
    createOT();
    setStatus('🆕 Sesión nueva — datos se guardarán en la nube','info');
  }
  document.getElementById('loading-overlay').style.display='none';
  applyEditLockState();
  setOTFilter('abiertas');
}

function createOT(){
  const id=++otId;
  const ot={
    id,
    num:'OT-'+String(id).padStart(3,'0'),
    desc:'',
    cliente:'',
    rows:[],
    cerrada:false
  };
  ots.push(ot);
  renderOTTab(ot);
  renderOTPanel(ot);
  addRow(id);
  activateOT(id);
  autosave();
}

function activateOT(id){
  activeOT=id;
  document.querySelectorAll('.ot-tab').forEach(t=>t.classList.toggle('active',+t.dataset.id===id));
  document.querySelectorAll('.ot-panel').forEach(p=>p.style.display=+p.dataset.id===id?'block':'none');
  updateTabLabel(id);
}

function renderOTTab(ot){
  const bar=document.getElementById('ot-tabs-bar');
  const btn=bar.querySelector('.btn-new-ot');
  const tab=document.createElement('button');
  tab.className='ot-tab';
  tab.dataset.id=ot.id;
  tab.id='tab-ot-'+ot.id;
  tab.onclick=()=>activateOT(ot.id);
  tab.innerHTML=`<span class="tab-label">${ot.num}</span>`;
  const x=document.createElement('button');
  x.className='close-ot';
  x.title='Eliminar OT';
  x.textContent='✕';
  x.onclick=function(e){e.stopPropagation();removeOT(ot.id);return false;};
  tab.appendChild(x);
  bar.insertBefore(tab,btn);
  applyOTFilter();
}

function updateTabLabel(id){
  const ot=ots.find(o=>o.id===id);if(!ot)return;
  const tab=document.getElementById('tab-ot-'+id);if(!tab)return;
  tab.querySelector('.tab-label').textContent=ot.num;
  const isActive=(id===activeOT);
  const colorState=getOTColorState(ot);
  tab.className='ot-tab'+(isActive?' active':'')+(colorState?' estado-'+colorState:'');
}

function removeOT(id){
  const ot=ots.find(o=>o.id===id);
  showModal(`¿Eliminar la OT "${ot?.num||id}" de forma permanente? Esta acción no se puede deshacer.`,()=>{
    ots=ots.filter(o=>o.id!==id);
    document.getElementById('tab-ot-'+id)?.remove();
    document.getElementById('panel-ot-'+id)?.remove();
    if(activeOT===id){
      const r=ots[ots.length-1];
      if(r)activateOT(r.id);else activeOT=null;
    }
    autosave();
  });
}
function removeOTConfirm(id){removeOT(id);}

function renderOTPanel(ot){
  const div=document.createElement('div');
  div.className='ot-content ot-panel';
  div.dataset.id=ot.id;
  div.id='panel-ot-'+ot.id;
  div.style.display='none';
  div.innerHTML=`
    <div class="ot-meta">
      <label>Nº OT:</label>
      <input type="text" id="otnum-${ot.id}" value="${ot.num}"
        oninput="const o=ots.find(o=>o.id===${ot.id});o.num=this.value;updateTabLabel(${ot.id});autosave()">
      <label>Descripción:</label>
      <input type="text" id="otdesc-${ot.id}" value="${ot.desc || ''}" placeholder="Descripción del trabajo"
        oninput="const o=ots.find(o=>o.id===${ot.id});o.desc=this.value;autosave()" style="width:220px">
      <label>Cliente:</label>
      <input type="text" id="otcli-${ot.id}" value="${ot.cliente || ''}" placeholder="Nombre del cliente"
        oninput="const o=ots.find(o=>o.id===${ot.id});o.cliente=this.value;autosave()" style="width:180px">
      <span id="badge-${ot.id}" class="badge badge-abierta">🔓 Abierta</span>
      <button class="btn-a btn-danger" style="font-size:11px;padding:4px 10px" onclick="removeOTConfirm(${ot.id})">🗑 Eliminar OT</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:24px">#</th>
          <th style="width:80px">Fecha</th>
          <th style="width:120px">Operario</th>
          <th style="width:120px">Proceso</th>
          <th style="width:100px">Hora inicio</th>
          <th style="width:200px">Controles</th>
          <th style="width:80px">Hora fin</th>
          <th style="width:100px">Total neto</th>
          <th>Observaciones</th>
          <th style="width:26px"></th>
        </tr></thead>
        <tbody id="tbody-${ot.id}"></tbody>
      </table>

      <div class="ot-footer-left">

        <button class="btn-a btn-finalizar" id="btnfin-${ot.id}" onclick="finalizarOT(${ot.id})">✔ Finalizar OT</button>
      </div>
      <div class="ot-footer-right">
        <div class="total-bar" id="totalbar-${ot.id}">Tiempo total: 0h 00min</div>
        <button class="btn-a btn-print-ot" onclick="printOT(${ot.id})">🖨 Imprimir / PDF</button>

function addRow(otId){
  const ot=ots.find(o=>o.id===otId);if(!ot||ot.cerrada)return;
  const id=++rowId;
  const r={id,otId,startTs:null,endTs:null,pauses:[],pauseStart:null,locked:false};
  ot.rows.push(r);
  appendRowEl(otId,r,{fecha:today(),operario:'',proceso:'',obs:''});
  refreshRowNums(otId);
  updateTabLabel(otId);
  autosave();
}

function appendRowEl(otId,r,fields){
  const tbody=document.getElementById('tbody-'+otId);
  const tr=document.createElement('tr');
  tr.id='row-'+r.id;
  tr.innerHTML=`
    <td style="color:#999;font-size:10px" class="rn"></td>
    <td><input class="cell" type="text" value="${fields.fecha||''}" placeholder="dd/mm/aa" oninput="autosave()"></td>
    <td><select class="cell" onchange="autosave()">${opOptions(fields.operario||'')}</select></td>
    <td><select class="cell" onchange="autosave()">${prOptions(fields.proceso||'')}</select></td>
    <td>
      <input class="cell hora-inicio" type="text"
             placeholder="hh:mm:ss"
             value=""
             oninput="manualTimeChange(${r.id}, 'start', this.value)">
    </td>
    <td><div class="time-cell">
      <button class="btn-t btn-start" id="bs-${r.id}" onclick="pressStart(${r.id})">INICIO</button>
      <button class="btn-t btn-pause" id="bp-${r.id}" onclick="pressPause(${r.id})" disabled>⏸ PAUSA</button>
      <button class="btn-t btn-end"   id="be-${r.id}" onclick="pressEnd(${r.id})"   disabled>FIN</button>
    </div></td>
    <td>
      <input class="cell hora-fin" type="text"
             placeholder="hh:mm:ss"
             value=""
             oninput="manualTimeChange(${r.id}, 'end', this.value)">
    </td>
    <td class="total-cell"><span class="total-disp">—</span><span class="pause-info"></span></td>
    <td><input class="cell obs" type="text" value="${fields.obs||''}" placeholder="Notas…" oninput="autosave()"></td>
    <td><button class="btn-del" id="bd-${r.id}" onclick="delRow(${r.id},${otId})">✕</button></td>`;
  tbody.appendChild(tr);
  renderRow(r);
}

function pressStart(id){
  const r=allRows().find(x=>x.id===id);if(!r||r.locked)return;
  r.startTs=Date.now();r.endTs=null;r.pauses=[];r.pauseStart=null;
  renderRow(r);
  updateTabLabel(r.otId);
  autosave();
}
function pressPause(id){
  const r=allRows().find(x=>x.id===id);if(!r||r.locked||!r.startTs||r.endTs)return;
  if(!r.pauseStart)r.pauseStart=Date.now();
  else{r.pauses.push({from:r.pauseStart,to:Date.now()});r.pauseStart=null;}
  renderRow(r);
  updateTabLabel(r.otId);
  autosave();
}
function pressEnd(id){
  const r=allRows().find(x=>x.id===id);if(!r||!r.startTs||r.locked)return;
  if(r.pauseStart){r.pauses.push({from:r.pauseStart,to:Date.now()});r.pauseStart=null;}
  r.endTs=Date.now();r.locked=true;
  renderRow(r);
  updateTabLabel(r.otId);
  autosave();
}

function parseHoraTexto(fechaStr, horaStr){
  if(!fechaStr || !horaStr) return null;
  const fParts = fechaStr.split('/');
  if(fParts.length < 3) return null;
  const d = parseInt(fParts[0],10);
  const m = parseInt(fParts[1],10)-1;
  const y = parseInt(fParts[2],10);
  const hParts = horaStr.split(':');
  const h = parseInt(hParts[0],10);
  const mi = parseInt(hParts[1]||'0',10);
  const s = parseInt(hParts[2]||'0',10);
  if(isNaN(d)||isNaN(m)||isNaN(y)||isNaN(h)||isNaN(mi)||isNaN(s)) return null;
  return new Date(y,m,d,h,mi,s).getTime();
}

function manualTimeChange(rowId, tipo, valor){
  if(!editUnlocked) return; // solo tú con contraseña
  const r = allRows().find(x=>x.id===rowId);
  if(!r) return;
  const tr = document.getElementById('row-'+r.id);
  if(!tr) return;
  const cells = tr.querySelectorAll('.cell');
  const fechaStr = cells[0]?.value || '';
  const ts = parseHoraTexto(fechaStr, valor.trim());
  if(!ts) return; // formato incorrecto, no tocamos nada

  if(tipo === 'start'){
    r.startTs = ts;
    if(!r.endTs) r.endTs = ts;
  }else if(tipo === 'end'){
    r.endTs = ts;
    if(!r.startTs) r.startTs = ts;
  }

  // Si tocas horas a mano, borramos pausas para simplificar
  r.pauses = [];
  r.pauseStart = null;
  r.locked = !!(r.startTs && r.endTs);

  renderRow(r);
  updateTabLabel(r.otId);
  autosave();
}

function calcNetSec(r){
  if(!r.startTs||!r.endTs)return 0;
  const gross=Math.floor((r.endTs-r.startTs)/1000);
  const paused=(r.pauses||[]).reduce((a,p)=>a+Math.floor((p.to-p.from)/1000),0);
  return Math.max(0,gross-paused);
}

function renderRow(r){
  const tr=document.getElementById('row-'+r.id);if(!tr)return;
  const td=tr.querySelector('.total-disp');
  const pi=tr.querySelector('.pause-info');
  const bs=document.getElementById('bs-'+r.id);
  const bp=document.getElementById('bp-'+r.id);
  const be=document.getElementById('be-'+r.id);
  const bd=document.getElementById('bd-'+r.id);
  const inpStart = tr.querySelector('.hora-inicio');
  const inpEnd   = tr.querySelector('.hora-fin');

  if(inpStart){
    if(r.startTs){
      const d = new Date(r.startTs);
      inpStart.value = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    }else{
      inpStart.value = '';
    }
  }
  if(inpEnd){
    if(r.endTs){
      const d = new Date(r.endTs);
      inpEnd.value = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    }else{
      inpEnd.value = '';
    }
  }

  if(bs)bs.disabled=!!(r.startTs||r.locked);
  if(bp){
    bp.disabled=!r.startTs||!!r.endTs||r.locked;
    if(r.pauseStart){bp.textContent='▶ REANUDAR';bp.className='btn-t btn-pause resuming';}
    else{bp.textContent='⏸ PAUSA';bp.className='btn-t btn-pause';}
  }
  if(be){
    be.disabled=!r.startTs||r.locked;
    if(r.locked){be.textContent='🔒';be.className='btn-t btn-end locked';}
    else{be.textContent='FIN';be.className='btn-t btn-end';}
  }

  if(bd) bd.disabled = r.locked && !editUnlocked;

  const pausedSec=(r.pauses||[]).reduce((a,p)=>a+Math.floor((p.to-p.from)/1000),0);
  if(pi)pi.textContent=pausedSec?'⏸ pausado: '+fmtSecShort(pausedSec):'';
  const s=calcNetSec(r);
  if(td)td.textContent=s?fmtSec(s):(r.pauseStart?'en pausa…':'—');

  const cells = tr.querySelectorAll('.cell');
  cells.forEach((c,i)=>{
    if(i===0){ // Fecha
      c.disabled = !editUnlocked;
    }else{
      c.disabled = false;
    }
  });

  if(r.locked)tr.classList.add('row-locked');else tr.classList.remove('row-locked');
  updateOTTotal(r.otId);
}

function delRow(id,otId){
  const ot=ots.find(o=>o.id===otId);if(!ot)return;
  ot.rows=ot.rows.filter(r=>r.id!==id);
  document.getElementById('row-'+id)?.remove();
  refreshRowNums(otId);
  updateOTTotal(otId);
  updateTabLabel(otId);
  autosave();
}
function allRows(){return ots.flatMap(o=>o.rows)}
function refreshRowNums(otId){
  const ot=ots.find(o=>o.id===otId);if(!ot)return;
  ot.rows.forEach((r,i)=>{const td=document.querySelector('#row-'+r.id+' .rn');if(td)td.textContent=i+1;});
}
function updateOTTotal(otId){
  const ot=ots.find(o=>o.id===otId);if(!ot)return;
  const t=ot.rows.reduce((a,r)=>a+calcNetSec(r),0);
  const el=document.getElementById('totalbar-'+otId);
  if(el)el.textContent='Tiempo total: '+fmtSecShort(t);
}

// Finalizar / Reabrir
function applyFinalizarUI(id){
  const ot=ots.find(o=>o.id===id);if(!ot)return;
  const badge=document.getElementById('badge-'+id);
  if(badge){badge.className='badge badge-cerrada';badge.textContent='🔒 Cerrada';}
  const btnAdd=document.getElementById('btnadd-'+id);if(btnAdd)btnAdd.disabled=true;
  const btnFin=document.getElementById('btnfin-'+id);
  if(btnFin){btnFin.textContent='↺ Reabrir OT';btnFin.className='btn-a btn-reabrir';btnFin.onclick=()=>reabrirOT(id);}
  const panel=document.getElementById('panel-ot-'+id);
  if(panel){
    panel.querySelectorAll('.btn-t:not(.locked)').forEach(b=>{if(!b.classList.contains('btn-end'))b.disabled=true;});
    panel.querySelectorAll('.cell:not(:disabled)').forEach(i=>i.disabled=true);
  }
  updateTabLabel(id);
  applyOTFilter();
}
function restoreCerrada(id){
  const ot=ots.find(o=>o.id===id);if(!ot)return;
  ot.cerrada=true;applyFinalizarUI(id);
}
function finalizarOT(id){
  const ot=ots.find(o=>o.id===id);if(!ot)return;
  showModal(`¿Finalizar la OT "${ot.num}"? Ya no se podrán añadir más filas.`,()=>{
    ot.cerrada=true;applyFinalizarUI(id);autosave();
  });
}
function reabrirOT(id){
  const ot=ots.find(o=>o.id===id);if(!ot)return;
  ot.cerrada=false;
  const badge=document.getElementById('badge-'+id);
  if(badge){badge.className='badge badge-abierta';badge.textContent='🔓 Abierta';}
  const btnAdd=document.getElementById('btnadd-'+id);if(btnAdd)btnAdd.disabled=false;
  const btnFin=document.getElementById('btnfin-'+id);
  if(btnFin){btnFin.textContent='✔ Finalizar OT';btnFin.className='btn-a btn-finalizar';btnFin.onclick=()=>finalizarOT(id);}
  ot.rows.forEach(r=>{if(!r.locked){
    const tr=document.getElementById('row-'+r.id);
    if(tr)tr.querySelectorAll('.cell').forEach(i=>i.disabled=false);
    renderRow(r);
  }});
  updateTabLabel(id);autosave();
  applyOTFilter();
}

function getRowFields(r){
  const tr=document.getElementById('row-'+r.id);
  const c=tr?tr.querySelectorAll('.cell'):[];
  return{fecha:c[0]?.value||'',operario:c[1]?.value||'',proceso:c[2]?.value||'',obs:c[3]?.value||''};
}

// Bloqueo/desbloqueo de edición
function applyEditLockState(){
  const btn = document.getElementById('btn-edit-lock');
  if(btn){
    if(editUnlocked){
      btn.textContent = '🔓 Edición desbloqueada';
      btn.style.background = '#27ae60';
    }else{
      btn.textContent = '🔒 Edición bloqueada';
      btn.style.background = '#8e44ad';
    }
  }

  ots.forEach(ot=>{
    const numEl=document.getElementById('otnum-'+ot.id);
    const descEl=document.getElementById('otdesc-'+ot.id);
    const cliEl=document.getElementById('otcli-'+ot.id);
    [numEl,descEl,cliEl].forEach(el=>{
      if(!el)return;
      el.disabled = false;
    });

    ot.rows.forEach(r=>{
      const tr=document.getElementById('row-'+r.id);
      if(!tr)return;
      const cells = tr.querySelectorAll('.cell');
      cells.forEach((c,i)=>{
        if(i===0){ // Fecha
          c.disabled = !editUnlocked;
        }else{
          c.disabled = false;
        }
      });
      const bd = document.getElementById('bd-'+r.id);
      if(bd) bd.disabled = r.locked && !editUnlocked;
    });
  });
}

function toggleEditLock(){
  if(!editUnlocked){
    const pwd = prompt('Introduce la contraseña para desbloquear edición:');
    if(pwd !== EDIT_PASSWORD){
      alert('Contraseña incorrecta');
      return;
    }
    editUnlocked = true;
  }else{
    editUnlocked = false;
  }
  applyEditLockState();
}

// Resumen (igual que antes)
function collectResumenData(){
  let grand=0;
  const otList=[],byWorker={},byProcess={};
  ots.forEach(ot=>{
    const otTotal=ot.rows.reduce((a,r)=>a+calcNetSec(r),0);grand+=otTotal;
    const byOp={},byPr={};
    ot.rows.forEach(r=>{
      const f=getRowFields(r);
      const op=f.operario||'Sin asignar',pr=f.proceso||'Sin proceso';
      const s=calcNetSec(r);
      byOp[op]=(byOp[op]||0)+s;byPr[pr]=(byPr[pr]||0)+s;
      if(!byWorker[op])byWorker[op]={total:0,ots:{}};
      byWorker[op].total+=s;byWorker[op].ots[ot.num]=(byWorker[op].ots[ot.num]||0)+s;
      if(!byProcess[pr])byProcess[pr]={total:0,ots:{}};
      byProcess[pr].total+=s;byProcess[pr].ots[ot.num]=(byProcess[pr].ots[ot.num]||0)+s;
    });
    otList.push({ot,otTotal,byOp,byPr});
  });
  return{grand,otList,byWorker,byProcess};
}

function buildResumen(){
  const grid=document.getElementById('resumen-grid');grid.innerHTML='';
  if(!ots.length){
    grid.innerHTML='<p style="color:#aaa;font-size:12px;padding:10px">No hay OT registradas.</p>';
    document.getElementById('gt-val').textContent='0h 00min';
    return;
  }
  const{grand,otList,byWorker,byProcess}=collectResumenData();
  document.getElementById('gt-val').textContent=fmtSecShort(grand);
  let html='<div style="grid-column:1/-1;font-size:12px;font-weight:700;color:#1a1a2e;padding:4px 0 2px;border-bottom:2px solid #1a1a2e;text-transform:uppercase">📋 Por OT</div>';
  otList.forEach(({ot,otTotal,byOp,byPr})=>{
    const st=ot.cerrada?'<span class="status-badge status-closed">🔒 Cerrada</span>':'<span class="status-badge status-open">🔓 Abierta</span>';
    let rows=Object.entries(byOp).map(([k,v])=>`<div class="rcard-row"><span class="rcard-label">👷 ${k}</span><span class="rcard-val">${fmtSecShort(v)}</span></div>`).join('');
    rows+=Object.entries(byPr).map(([k,v])=>`<div class="rcard-row"><span class="rcard-label">⚙ ${k}</span><span class="rcard-val">${fmtSecShort(v)}</span></div>`).join('');
    if(!rows)rows='<div style="color:#aaa;font-size:11px;padding:6px 0">Sin datos</div>';
    html+=`<div class="resumen-card"><div class="rcard-head"><span>${ot.num}${ot.desc?' — '+ot.desc:''}${ot.cliente?' · '+ot.cliente:''}</span>${st}</div><div class="rcard-body">${rows}</div><div class="rcard-row" style="padding:6px 12px;font-weight:700;background:#f0f0f0"><span>TOTAL OT</span><span>${fmtSecShort(otTotal)}</span></div></div>`;
  });
  html+='<div style="grid-column:1/-1;font-size:12px;font-weight:700;color:#2c3e6e;padding:10px 0 2px;border-bottom:2px solid #2c3e6e;text-transform:uppercase;margin-top:8px">👷 Por Operario</div>';
  Object.entries(byWorker).sort((a,b)=>b[1].total-a[1].total).forEach(([w,d])=>{
    let rows=Object.entries(d.ots).map(([n,s])=>`<div class="rcard-row"><span class="rcard-label">📋 ${n}</span><span class="rcard-val">${fmtSecShort(s)}</span></div>`).join('');
    html+=`<div class="resumen-card"><div class="rcard-head" style="background:#2c3e6e">👷 ${w}</div><div class="rcard-body">${rows}</div><div class="rcard-row" style="padding:6px 12px;font-weight:700;background:#eaf0fb"><span>TOTAL</span><span>${fmtSecShort(d.total)}</span></div></div>`;
  });
  html+='<div style="grid-column:1/-1;font-size:12px;font-weight:700;color:#4a235a;padding:10px 0 2px;border-bottom:2px solid #4a235a;text-transform:uppercase;margin-top:8px">⚙ Por Proceso</div>';
  Object.entries(byProcess).sort((a,b)=>b[1].total-a[1].total).forEach(([p,d])=>{
    let rows=Object.entries(d.ots).map(([n,s])=>`<div class="rcard-row"><span class="rcard-label">📋 ${n}</span><span class="rcard-val">${fmtSecShort(s)}</span></div>`).join('');
    html+=`<div class="resumen-card"><div class="rcard-head" style="background:#4a235a">⚙ ${p}</div><div class="rcard-body">${rows}</div><div class="rcard-row" style="padding:6px 12px;font-weight:700;background:#f5eefa"><span>TOTAL</span><span>${fmtSecShort(d.total)}</span></div></div>`;
  });
  grid.innerHTML=html;
}

function showView(name){
  document.querySelectorAll('.view-tab').forEach((t,i)=>t.classList.toggle('active',['registro','resumen'][i]===name));
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  function setCarpetaOperario(nombre){
  carpetaOperario = nombre;

  const tabs = document.querySelectorAll('#operario-tabs .view-tab');
  tabs.forEach(t => {
    t.classList.toggle('active', t.textContent.includes(nombre));
  });
}
}
